name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import application source (first run only)
        env:
          SOURCE_ARCHIVE: https://github.com/aryanshetty07/skillbridge-v2/releases/download/v2.0.0/SkillBridge-v2-source.zip
        run: |
          if [ -f src/App.jsx ]; then
            echo "Source already present in the repository - skipping import."
            exit 0
          fi
          set -e
          curl -fsSL -o /tmp/source.zip "$SOURCE_ARCHIVE"
          mkdir -p /tmp/src
          unzip -q -o /tmp/source.zip -d /tmp/src
          rsync -a --exclude '.git' /tmp/src/skillbridge-v2/ ./
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import SkillBridge v2 application source"
          git push origin HEAD:main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
